# Assistant (ticket tracker built in) + local speech-to-text, on your Linux server. Nothing is published to the internet:
# set BIND_ADDR to the server's Tailscale IP (tailscale ip -4) so only your tailnet can reach it.
services:
  assistant:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      CODE_ROOT: ${CODE_MOUNT:-/workspace}
      # Claude Code runs on the HOST (in a tmux server started by the host's systemd, see docs/web-ui.md): the container only sends it commands through this socket.
      CODE_TMUX_SOCKET: ${CODE_TMUX_SOCKET:-assistant-code}
      CODE_CLAUDE_BIN: ${CODE_CLAUDE_BIN:-claude}
      CODE_CONFIG_DIR: ${CODE_CONFIG_DIR:-/home/node/.claude}
      CODE_GLOBAL_CONFIG: ${CODE_GLOBAL_CONFIG:-/home/node/.claude.json}
      TRANSCRIBE_URL: http://whisper:8000/v1/audio/transcriptions
      INDEX_PATHS: ${INDEX_PATHS:-}
    volumes:
      - ./data:/data
      - ./claude-home:/home/node/.claude        # Claude Code login lives here (see README: one-time `claude login`)
      - /tmp/tmux-1000:/tmp/tmux-1000                # the host's tmux sockets: the Code tab finds Claude sessions you started in your own terminals
      # The Code tab's projects. CODE_DIR is a folder on the host; CODE_MOUNT is where it appears in the container.
      # Use the SAME absolute path for both (e.g. /home/you) and projects keep their real paths, so tmux sessions, git and logs match the host.
      - ${CODE_DIR:-./workspace}:${CODE_MOUNT:-/workspace}
      # - /mnt/smb/share:/index/share:ro          # your SMB share, mounted on the host, read-only; then INDEX_PATHS=/index
    ports: ["${BIND_ADDR:-127.0.0.1}:8090:8090"]
    depends_on: [whisper]
  whisper:                                       # OpenAI-compatible speech-to-text, CPU, local. Verify the image name when you first pull it.
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    volumes: ["./whisper-cache:/home/ubuntu/.cache/huggingface/hub"]
